<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>토스 송금 열기</title>
<style>
  :root { --bg: #f6f7f9; --fg: #191f28; --muted: #6b7684; --accent: #3182f6; --ink: #fff; --line: #e5e8eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17171c; --fg: #f2f4f6; --muted: #9ea7b3; --accent: #4a90ff; --ink: #fff; --line: #2c2c35; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 32px 16px; display: grid; gap: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .box { background: var(--surface, transparent); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 6px; }
  .amt { font-size: 26px; font-weight: 700; }
  .muted { color: var(--muted); font-size: 14px; }
  a.go { display: flex; justify-content: center; align-items: center; min-height: 52px; border-radius: 10px; background: var(--accent); color: var(--ink); font-weight: 700; font-size: 17px; text-decoration: none; }
  .err { color: #e5484d; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>토스 송금 열기</h1>
  <div id="out" class="box"><span class="muted">확인 중…</span></div>
  <p class="muted">CS 보드의 [토스로 송금] 버튼이 여는 중간 페이지예요. 토스 송금 화면을 채워서 열기만 하고, 보내기·인증은 토스에서 직접 하세요. 이 페이지는 아무 데도 값을 보내거나 저장하지 않아요(값은 주소의 # 뒤에만 있고 서버로 가지 않아요).</p>
</main>
<script>
// 주소 모양: #b=<은행명>&a=<계좌 숫자>&m=<금액 정수>&t=<받는 분 표시>
(function () {
  var out = document.getElementById("out");
  var p = new URLSearchParams(location.hash.slice(1));
  // 방문 기록에 계좌가 남지 않게 # 뒤를 지워요.
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  var bank = (p.get("b") || "").trim(), acct = (p.get("a") || "").replace(/[\s-]/g, ""), amt = p.get("m") || "", msg = (p.get("t") || "환불").slice(0, 20);
  // 은행 이름을 토스 화면에 적힌 이름으로 바꿔요(2026-11-25 사장님: "국민은행"으로 넘기면 에러, 토스는 "KB국민"). 표에 없으면 은행을 빼고 넘겨 토스가 고르게 해요.
  function tossBank(b) {
    var s = b.replace(/\s|\(|\)|주식회사|㈜/g, "").toUpperCase();
    if (!s) return "";
    var sec = [["토스증권", /토스증권/], ["카카오페이증권", /카카오페이증권/], ["미래에셋", /미래에셋/], ["키움", /키움/], ["한국투자", /한국투자/], ["신한투자", /신한(금융)?투자/],
      ["삼성증권", /삼성증권/], ["KB증권", /KB증권|국민증권/], ["NH투자", /NH투자|농협투자/], ["유안타", /유안타/], ["대신", /대신/], ["IBK투자", /IBK투자|기업투자/],
      ["하나증권", /하나증권|하나금융투자/], ["한화투자", /한화/], ["유진투자", /유진/], ["아이엠증권", /아이엠증권|IM증권/], ["메리츠증권", /메리츠/], ["SK", /SK증권/],
      ["LS", /LS증권|이베스트/], ["현대차증권", /현대차/], ["DB증권", /DB증권|DB금융투자/], ["우리투자증권", /우리투자증권|우리종합금융/], ["신영", /신영/],
      ["다올투자증권", /다올/], ["케이프투자", /케이프/], ["BNK투자", /BNK투자/], ["부국", /부국/], ["상상인증권", /상상인/], ["교보", /교보증권/]];
    for (var i = 0; i < sec.length; i++) if (sec[i][1].test(s)) return sec[i][0];
    var bk = [["교보SBI저축은행", /교보SBI|SBI/], ["저축은행", /저축/], ["NH농협", /농협|NH/], ["카카오뱅크", /카카오|카뱅/], ["KB국민", /국민|KB/], ["토스뱅크", /토스/],
      ["신한", /신한/], ["우리", /우리/], ["IBK기업", /기업|IBK/], ["하나", /하나|KEB|외환/], ["새마을", /새마을|MG/], ["부산", /부산/],
      ["iM뱅크(대구)", /대구|IM뱅크|아이엠뱅크/], ["케이뱅크", /케이뱅크|K뱅크/], ["신협", /신협|신용협동/], ["우체국", /우체국|우정/], ["SC제일", /SC|제일|스탠다드/],
      ["경남", /경남/], ["광주", /광주/], ["수협", /수협/], ["전북", /전북/], ["제주", /제주/], ["씨티", /씨티|시티|CITI/], ["KDB산업", /산업|KDB/], ["산림조합", /산림/]];
    for (var j = 0; j < bk.length; j++) if (bk[j][1].test(s)) return bk[j][0];
    return "";
  }
  bank = tossBank(bank);
  function show(html) { out.innerHTML = html; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  // 은행명이 없으면 은행 칸을 비워 보내요. 토스가 은행을 고르라고 띄워요(11/24 사장님 시험 "좋아").
  if (!/^\d{8,16}$/.test(acct) || !/^[1-9]\d{0,7}$/.test(amt)) { show('<span class="err">링크 값이 이상해서 열지 않았어요.</span><span class="muted">보드에서 다시 눌러 주세요.</span>'); return; }
  var q = (bank ? "bank=" + encodeURIComponent(bank) + "&" : "") + "accountNo=" + acct + "&amount=" + amt + "&msg=" + encodeURIComponent(msg);
  var href = /Android/i.test(navigator.userAgent) ? "intent://send?" + q + "#Intent;scheme=supertoss;package=viva.republica.toss;end" : "supertoss://send?" + q;
  // 기다리지 않고 바로 열어요(11/24 사장님 "살짝 느리게 열리네"). 안 열리면 아래 [토스 열기]를 누르면 돼요.
  location.href = href;
  show('<span class="muted">' + esc(bank || "은행은 토스에서 고르기") + " · 계좌 끝 " + esc(acct.slice(-4)) + '</span><span class="amt">' + Number(amt).toLocaleString("ko-KR") + '원</span>'
    + '<span class="muted">받는 분 표시: ' + esc(msg) + '</span><a class="go" id="go" href="' + esc(href) + '">토스 열기</a>');
})();
</script>
</body>
</html>
